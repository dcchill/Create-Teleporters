plugins {
    id 'eclipse'
    id 'net.neoforged.moddev' version '2.0.95'
}

version = '2.0-1.21.1'
base.archivesName = "createteleporters"

apply from: "custom.gradle"

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = "21.1.190"

    runs {
        client {
            client()
        }
        server {
            server()
        }
        gameTestServer {
            type = "gameTestServer"
            gameDirectory = file('build/train-gametest')
            systemProperty 'neoforge.enabledGameTestNamespaces', 'createteleporters'
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        createteleporters {
            sourceSet sourceSets.main
        }
    }
}

// Compile the integration checks only for the explicit development test run.
// These are in-game tests, not standalone JVM tests.
sourceSets.test.java.setSrcDirs([])
sourceSets.test.resources.setSrcDirs([])
if (providers.gradleProperty('trainPortalTests').isPresent()) {
    sourceSets.main.java.srcDir 'src/test/java'
    sourceSets.main.resources.srcDir 'src/test/resources'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

