repositories {
    flatDir {
        dirs 'libs'
    }

    maven { url = "https://raw.githubusercontent.com/Fuzss/modresources/main/maven/" }
    maven { url = "https://maven.createmod.net" }

    maven { url = "https://www.cursemaven.com" }
}

def createJarJarDependencyDir = layout.buildDirectory.dir("createJarJarDependencies")
def extractCreateJarJarDependencies = tasks.register("extractCreateJarJarDependencies", Copy) {
    from(zipTree("libs/create-1.21.1-6.0.10.jar")) {
        include "META-INF/jarjar/flywheel-neoforge-1.21.1-1.0.6.jar"
        include "META-INF/jarjar/ponder-neoforge-1.0.82+mc1.21.1.jar"
        include "META-INF/jarjar/Registrate-MC1.21-1.3.0+67.jar"
        eachFile { details -> details.path = details.name }
    }
    includeEmptyDirs = false
    into createJarJarDependencyDir
}

dependencies {
    compileOnly name: "create-1.21.1-6.0.10"
    runtimeOnly name: "create-1.21.1-6.0.10"
    compileOnly fileTree(dir: createJarJarDependencyDir.get().asFile, include: ["*.jar"])

    
    // Immersive Portals compatibility (optional - requires mod to be installed at runtime)
    // compileOnly fg.deobf("curse.maven:immersive-portals-for-forge-495466:5025474")
    // runtimeOnly fg.deobf("curse.maven:immersive-portals-for-forge-495466:5025474")
}

tasks.named("compileJava").configure {
    dependsOn extractCreateJarJarDependencies
}

tasks.named('processResources', ProcessResources).configure {
    from('src/main/java/net/createteleporters/mixin/createteleporters.mixins.json') {
        into ''
    }
}
